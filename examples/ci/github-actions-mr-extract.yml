# TeamAI MR Knowledge Extract — GitHub Actions
#
# When a PR is opened or updated, extracts knowledge suggestions automatically and posts them as comments on the PR;
# after the PR is merged, writes the learning and codebase suggestions to the team knowledge repo automatically.
#
# Configure before use:
#   Change the placeholders in the env below, and set the matching Secrets / Variables in Repository Settings

name: TeamAI MR Knowledge Extract

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_target:
    types: [closed]

env:
  TEAMAI_KNOWLEDGE_REPO: ${{ vars.TEAMAI_KNOWLEDGE_REPO }}
  TEAMAI_KNOWLEDGE_BRANCH: ${{ vars.TEAMAI_KNOWLEDGE_BRANCH || 'main' }}
  ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}

jobs:
  # ── When a PR is opened or updated: extract knowledge and show it as comments ──
  comment:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install teamai-cli
        run: npm install -g teamai-cli

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Extract and Comment
        run: |
          teamai ci extract-mr \
            --url "${{ github.event.pull_request.html_url }}" \
            --mode comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}

  # ── After the PR is merged: write knowledge to the team repo ──
  # teamwiki follows the same flow as `teamai import --dir . --incremental`: it runs in the merged source
  # checkout, re-extracts only the changed files, writes to
  # team-repo/teamwiki/evidence/code/github__<owner>__<repo>/, and the CLI commits and pushes itself.
  # The two repos are checked out side by side: the team repo cannot sit inside the source checkout, or it would be extracted as source.
  write:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TEAMAI_KNOWLEDGE_REPO }}
          ref: ${{ env.TEAMAI_KNOWLEDGE_BRANCH }}
          token: ${{ secrets.TEAMAI_SYNC_TOKEN }}
          path: team-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install teamai-cli
        run: npm install -g teamai-cli

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write Knowledge to Repo
        working-directory: source
        run: |
          teamai ci extract-mr \
            --url "${{ github.event.pull_request.html_url }}" \
            --mode write \
            --team-repo ../team-repo \
            --write-mode direct
        env:
          GITHUB_TOKEN: ${{ secrets.TEAMAI_SYNC_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
