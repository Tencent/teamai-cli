# TeamAI MR Knowledge Extract — GitHub Actions
#
# 在 PR 创建/更新时自动提炼知识建议并以 comment 贴到 PR 上；
# PR 合入后自动将 learning 和 codebase 建议写入团队知识仓库。
#
# 使用前请配置：
#   修改下方 env 中的占位符，并在 Repository Settings 中配置对应 Secrets / Variables

name: TeamAI MR Knowledge Extract

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_target:
    types: [closed]

env:
  TEAMAI_KNOWLEDGE_REPO: ${{ vars.TEAMAI_KNOWLEDGE_REPO }}
  TEAMAI_KNOWLEDGE_BRANCH: ${{ vars.TEAMAI_KNOWLEDGE_BRANCH || 'main' }}
  ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}

jobs:
  # ── PR 创建/更新时：提炼知识并以 comment 形式展示 ──────────
  comment:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install teamai-cli
        run: npm install -g teamai-cli

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Extract and Comment
        run: |
          teamai ci extract-mr \
            --url "${{ github.event.pull_request.html_url }}" \
            --mode comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}

  # ── PR 合入后：将知识写入团队仓库 ─────────────────────────
  # teamwiki 走 `teamai import --dir . --incremental` 的同一流程：在合入后的源码
  # checkout 中运行，只重新提取改过的文件，写入
  # team-repo/teamwiki/evidence/code/github__<owner>__<repo>/，CLI 自行 commit 并 push。
  # 两个仓库并排 checkout：团队仓库不能放在源码 checkout 内，否则会被当成源码提取。
  write:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TEAMAI_KNOWLEDGE_REPO }}
          ref: ${{ env.TEAMAI_KNOWLEDGE_BRANCH }}
          token: ${{ secrets.TEAMAI_SYNC_TOKEN }}
          path: team-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install teamai-cli
        run: npm install -g teamai-cli

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write Knowledge to Repo
        working-directory: source
        run: |
          teamai ci extract-mr \
            --url "${{ github.event.pull_request.html_url }}" \
            --mode write \
            --team-repo ../team-repo \
            --write-mode direct
        env:
          GITHUB_TOKEN: ${{ secrets.TEAMAI_SYNC_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
