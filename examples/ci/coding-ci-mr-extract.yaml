# TeamAI MR Knowledge Extract — Zhiyan / Coding CI (TGit)
#
# When an MR is opened or updated, extracts knowledge suggestions automatically and posts them as comments on the MR;
# after the MR is merged, writes the learning, codebase and graph suggestions to the team knowledge repo automatically.
#
# Configure before use:
#   1. Create a pipeline in the Zhiyan web console: bind this TGit repo → point CIfile at this file's path →
#      tick MR as the trigger. Note: the MR trigger rules **must** be declared in the `mr:` block of this YAML;
#      ticking them only in the Zhiyan UI has no effect.
#   2. Pipeline Secrets:
#        - TGIT_TOKEN: a TGit Personal Access Token with push access to the team knowledge repo
#        - ANTHROPIC_AUTH_TOKEN: the AI auth token
#      Note: teamai ci extract-mr reuses the AI extraction logic (callClaude); both the comment and
#      write modes spawn a local AI CLI, so the AI CLI and its credentials are **required**, not optional.
#   3. Replace the placeholders in the env below with your actual values:
#        - TEAMAI_KNOWLEDGE_REPO   team knowledge repo path (e.g. myteam/knowledge)
#        - ANTHROPIC_BASE_URL      AI gateway address (e.g. https://api.anthropic.com)

version: 2

# ── MR trigger rules (must be declared in the YAML; UI settings have no effect) ──
mr:
  action:
  - open
  - push-update
  - merge
  is_local_mr: true
  is_block_mr: true
  auto_cancel_same_merge_request: true

# ── Secrets and environment variables ──────────────────────────
env:
  TGIT_TOKEN:
    secret: ${TGIT_TOKEN_SECRET}
  ANTHROPIC_AUTH_TOKEN:
    secret: ${ANTHROPIC_AUTH_TOKEN_SECRET}
  TEAMAI_KNOWLEDGE_REPO:                                # team knowledge repo path (e.g. myteam/knowledge)
  TEAMAI_KNOWLEDGE_BRANCH: main                        # knowledge repo default branch
  ANTHROPIC_BASE_URL:                                  # AI API base URL (e.g. https://api.anthropic.com)
  ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
  ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
  ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-8

# ── Pipeline stages ────────────────────────────────────────────
stages:

# ── When an MR is opened or updated: extract knowledge and show it as comments ──
- stage: teamai-extract-comment
  tasks:
  - task: extract-and-comment
    cmds:
    - plugin: cmds
      params:
        cmds:
        - echo "=== [TeamAI] Installing CLI tools ==="
        # Public network: install from npm; on an intranet without public npm, use a local tarball instead, e.g.:
        #   npm install -g ./teamai-cli-<version>.tgz @anthropic-ai/claude-code
        - npm install -g teamai-cli @anthropic-ai/claude-code 2>&1 | tail -3
        - |
          echo "machine git.woa.com login private password ${TGIT_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          echo "=== [TeamAI] TGit auth configured ==="
        # Comment mode only fetches the MR and replies through REST, so it does not need to clone the team knowledge repo,
        # and therefore does not run `teamai init` (it needs interactive member registration, which is unavailable in CI).
        - |
          echo "=== [TeamAI] Trigger: ${QCI_TRIGGER_TYPE}, MR IID: ${QCI_MR_IID:-none} ==="
          if [ "${QCI_TRIGGER_TYPE}" = "TRIGGER_MR" ] && [ -n "${QCI_MR_IID}" ] && [ "${QCI_MR_IID}" != "None" ]; then
            MR_URL="${QCI_REPO%.git}/merge_requests/${QCI_MR_IID}"
          else
            echo "⏭ Not an MR trigger, skipping"
            exit 0
          fi
          echo "=== [TeamAI] MR_URL=$MR_URL ==="
          teamai ci extract-mr --url "$MR_URL" --mode comment --individual-comments

# ── After the MR is merged: write knowledge to the team knowledge repo ──
- stage: teamai-post-merge-write
  tasks:
  - task: write-knowledge
    cmds:
    - plugin: cmds
      params:
        cmds:
        - npm install -g teamai-cli @anthropic-ai/claude-code 2>&1 | tail -3
        - |
          if [ "${QCI_TRIGGER_TYPE}" != "TRIGGER_MR" ] || [ "${QCI_MR_ACTION}" != "merge" ]; then
            echo "=== [TeamAI] SKIP: Not a merge event ==="
            exit 0
          fi
          MR_URL="${QCI_REPO%.git}/merge_requests/${QCI_MR_IID}"
          echo "=== [TeamAI] Writing knowledge for $MR_URL ==="
          # Clone the team knowledge repo with the PAT (the PAT's git username is `private`).
          # Clone it outside the source checkout: inside the checkout it would be extracted as source, and the CLI skips the teamwiki update.
          TEAM_REPO_DIR=/tmp/teamai-team-repo
          git clone -b "${TEAMAI_KNOWLEDGE_BRANCH}" "https://private:${TGIT_TOKEN}@git.woa.com/${TEAMAI_KNOWLEDGE_REPO}.git" "$TEAM_REPO_DIR"
          # Run in the source checkout: teamwiki follows the same flow as `teamai import --dir . --incremental`,
          # re-extracts only the changed files, and writes to teamwiki/evidence/code/tgit__<group>__<repo>/.
          # --write-mode direct makes the CLI commit and push itself: the git identity is derived from the account
          # behind TGIT_TOKEN (REST /user), which satisfies the TGit committer-check. No manual git config/commit/push needed.
          teamai ci extract-mr --url "$MR_URL" --mode write --individual-comments --team-repo "$TEAM_REPO_DIR" --write-mode direct

worker:
  label: JOB_MATRIX_DEVCLOUD
  tools: []
  language: node_js-22.19.0

maximum_builds: 2
is_auto_cancel: false
